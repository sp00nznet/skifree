# The installer for this commit, for Windows, Linux and macOS (recomp-launcher
# with launcher/launcher.json): artifacts on every push to main, release files
# on a v* tag. The game itself is never in it: setup builds from the player's
# own ski32.exe.
name: installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@v0.4.0
    with:
      launcher-ref: v0.4.0
      name: SkiFree-Recomp-Installer

  # The optional second download: the same installer, building every console
  # (launcher-consoles/launcher.json, setup-consoles.sh) in Docker.
  consoles:
    needs: installer   # one release job at a time: the first creates the release
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@v0.4.0
    with:
      launcher-ref: v0.4.0
      manifest: launcher-consoles
      name: SkiFree-Consoles-Installer

  # Each installer job writes SHA256SUMS.txt for its own files; one for all of them.
  sums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, consoles]
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D out -p '*Installer*'
          (cd out && sha256sum -- * > SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" out/SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
