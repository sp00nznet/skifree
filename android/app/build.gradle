apply plugin: 'com.android.application'

android {
    namespace "org.libsdl.app"
    compileSdk 34
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "net.sp00nz.skifree"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                // SDL_CCACHE=OFF: SDL otherwise wraps the NDK compiler in any
                // ccache on PATH, and an unrelated old one (e.g. a PS3 SDK's)
                // breaks every compile.
                arguments "-DANDROID_APP_PLATFORM=android-21",
                          "-DANDROID_STL=c++_static",
                          "-DSDL_CCACHE=OFF"
                abiFilters 'x86_64', 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                          'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
